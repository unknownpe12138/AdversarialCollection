# 环境配置: 10智能体 × 20节点
# 大规模实验

name: "10vs20"
description: "Large scale: 10 agents, 20 nodes"

# 基本参数
n_agents: 10
n_nodes: 20

# 图拓扑（随机图）
graph_type: "random"
edge_probability: 0.3   # 边生成概率
graph_seed: null        # 图结构种子（null=每次随机）

# Episode设置
max_steps: 150

# 奖励设置
use_pbrs: true
death_penalty: 10.0
gamma: 0.99

# 节点属性范围
utility_range: [5.0, 20.0]
risk_range: [0.1, 0.5]

# 用于验证
expected_agents: 10
expected_nodes: 20
