# GPU优化配置: 20智能体 × 50节点
# 大规模问题才能充分利用GPU

name: "20vs50_gpu"
description: "20 agents, 50 nodes, GPU optimized"

# 大规模参数
n_agents: 20
n_nodes: 50

# 图拓扑
graph_type: "random"
edge_probability: 0.3
graph_seed: 42

# Episode设置
max_steps: 100

# 奖励设置
use_pbrs: true
death_penalty: 10.0
gamma: 0.99

# 节点属性范围
utility_range: [5.0, 20.0]
risk_range: [0.1, 0.5]

# 验证
expected_agents: 20
expected_nodes: 50
