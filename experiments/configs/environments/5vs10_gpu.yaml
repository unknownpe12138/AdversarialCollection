# GPU优化配置: 5智能体 × 10节点
# 增大batch size以提高GPU利用率

name: "5vs10_gpu"
description: "5 agents, 10 nodes, GPU optimized"

# 基本参数
n_agents: 5
n_nodes: 10

# 图拓扑（随机图）
graph_type: "random"
edge_probability: 0.4
graph_seed: 42

# Episode设置
max_steps: 50

# 奖励设置
use_pbrs: true
death_penalty: 10.0
gamma: 0.99

# 节点属性范围
utility_range: [5.0, 20.0]
risk_range: [0.1, 0.5]

# 用于验证
expected_agents: 5
expected_nodes: 10
