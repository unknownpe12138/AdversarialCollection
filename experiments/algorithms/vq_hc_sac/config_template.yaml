# VQ-HC-SAC算法配置模板

algorithm:
  name: "vq_hc_sac"
  version: "1.0.0"

# 角色配置
roles:
  n_roles: 2              # 角色数量（小规模推荐2，中等3，大规模4）
  embedding_dim: 32       # 角色嵌入维度

# 网络架构
networks:
  encoder:
    hidden_dims: [64, 64]  # 编码器隐藏层
  
  actor:
    hidden_dims: [128, 128]  # Actor隐藏层
  
  critic:
    hidden_dims: [128, 128]  # Critic隐藏层
    use_twin: true          # 使用Twin Critic

# 训练参数
training:
  batch_size: 32
  buffer_size: 50000
  warmup_steps: 500
  gamma: 0.99
  tau: 0.005

# 学习率
learning_rates:
  actor: 0.0003
  critic: 0.0003
  encoder: 0.0003
  alpha: 0.0003

# VQ模块
vq:
  beta: 0.25              # Commitment cost
  use_ema: false          # 使用EMA更新codebook

# 更新策略
updates:
  frequency: 1            # 每步更新次数
  updates_per_step: 1
  clip_grad_norm: 1.0

# 评估
evaluation:
  episodes: 3
  interval: 10000

# 其他
misc:
  save_interval: 5000
  log_interval: 1000
